name: Python application

on:
  workflow_dispatch:
    inputs:
      script_to_run:
        description: 'Script to run (league_ids, rosters, users, rosterhistory, matchups, scores, weekly_awards, players, transactions, drafts, standings, conference_championships, playoff_field, bowls, nit, all). Postseason scripts are manual only - not in all.'
        required: true
        default: 'all'
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 07:00 UTC (3 AM ET)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run selected script(s)
        run: |
          # Default to 'all' if no manual input was provided
          SCRIPT_TO_RUN="${{ github.event.inputs.script_to_run }}"
          if [ -z "$SCRIPT_TO_RUN" ]; then
              SCRIPT_TO_RUN="all"
          fi
          echo "Selected script: $SCRIPT_TO_RUN"

          # One failing script no longer aborts everything after it.
          # Each failure is recorded; the step fails at the end if any did,
          # AFTER the commit step below still saves whatever succeeded.
          set +e
          FAILED=""
          run() {  # run <name> <file> [in_all]
              if [ "$SCRIPT_TO_RUN" = "$1" ] || { [ "$3" = "all" ] && [ "$SCRIPT_TO_RUN" = "all" ]; }; then
                  echo "::group::$1"
                  python "scripts/$2"
                  rc=$?
                  echo "::endgroup::"
                  if [ $rc -ne 0 ]; then
                      echo "::error::$1 ($2) failed with exit code $rc"
                      FAILED="$FAILED $1"
                  fi
              fi
          }

          run league_ids            league_ids.py            all
          run rosters               rosters.py               all
          run matchups              league_matchups.py       all
          run users                 users.py                 all
          run players               players.py               all
          run rosterhistory         rosterhistory.py         all
          run transactions          league_transactions.py   all
          run drafts                league_drafts.py         all
          run scores                score_details.py         all
          run weekly_awards         weekly_awards.py         all
          run standings             standings.py             all

          # Postseason - manual only
          run conference_championships conference_championships.py
          run playoff_field            playoff_field.py
          run bowls                    bowls.py
          run nit                      nit.py

          echo "$FAILED" > /tmp/failed_scripts.txt

      - name: Commit and push CSVs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Auto-update CSVs" || echo "No changes to commit"
          git push

      - name: List CSVs
        if: always()
        run: ls -l data/

      - name: Record last modified times
        if: always()
        run: python scripts/update_lastmodified.py

      - name: Commit and push CSV modifieds
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Auto-update CSVs" || echo "No changes to commit"
          git push

      - name: Fail run if any script failed
        if: always()
        run: |
          FAILED=$(cat /tmp/failed_scripts.txt 2>/dev/null)
          if [ -n "$(echo $FAILED)" ]; then
              echo "::error::Failed scripts:$FAILED"
              exit 1
          fi
